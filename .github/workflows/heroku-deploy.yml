name: Deploy to Heroku

on:
  workflow_dispatch:
    inputs:
      heroku_app_name:
        description: "Heroku App name"
        required: true
        type: string
      heroku_api_key:
        description: "Heroku API key"
        required: true
        type: string
      heroku_email:
        description: "Heroku email address"
        required: true
        type: string
      heroku_team:
        description: "Heroku Team Name (optional)"
        required: false
        type: string
        default: ""
      bot_token:
        description: "Telegram bot token"
        required: true
        type: string
      owner_id:
        description: "Owner's telegram ID"
        required: true
        type: string
      api_id:
        description: "Telegram API_ID (my.telegram.org)"
        required: true
        type: string
      api_hash:
        description: "Telegram API_HASH (my.telegram.org)"
        required: true
        type: string
      upload_channel:
        description: "UPLOAD_CHANNEL (-100... or @name, optional)"
        required: false
        type: string
        default: ""
      dump_channel:
        description: "DUMP_CHANNEL (-100... or @name, optional)"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Login Heroku CLI
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        run: |
          set -euo pipefail
          cat > ~/.netrc <<EOF
machine api.heroku.com
  login ${{ inputs.heroku_email }}
  password ${{ inputs.heroku_api_key }}
machine git.heroku.com
  login ${{ inputs.heroku_email }}
  password ${{ inputs.heroku_api_key }}
EOF
          chmod 600 ~/.netrc
          heroku auth:whoami

      - name: Ensure app exists (container stack)
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
          APP: ${{ inputs.heroku_app_name }}
          TEAM: ${{ inputs.heroku_team }}
        run: |
          set -euo pipefail
          if heroku apps:info --app "$APP" >/dev/null 2>&1; then
            echo "App $APP already exists"
          else
            if [ -n "${TEAM}" ]; then
              heroku create "$APP" --team "$TEAM"
            else
              heroku create "$APP"
            fi
          fi
          heroku stack:set container --app "$APP" || true

      - name: Set config vars
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
          APP: ${{ inputs.heroku_app_name }}
        run: |
          set -euo pipefail
          heroku config:set \
            BOT_TOKEN="${{ inputs.bot_token }}" \
            OWNER_ID="${{ inputs.owner_id }}" \
            API_ID="${{ inputs.api_id }}" \
            API_HASH="${{ inputs.api_hash }}" \
            --app "$APP"

          if [ -n "${{ inputs.upload_channel }}" ]; then
            heroku config:set UPLOAD_CHANNEL="${{ inputs.upload_channel }}" --app "$APP"
          fi
          if [ -n "${{ inputs.dump_channel }}" ]; then
            heroku config:set DUMP_CHANNEL="${{ inputs.dump_channel }}" --app "$APP"
          fi

          heroku config --app "$APP" | sed 's/=.*/=***/' || true

      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build & push worker image
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
          APP: ${{ inputs.heroku_app_name }}
        run: |
          set -euo pipefail
          docker build -t "registry.heroku.com/${APP}/worker" .
          docker push "registry.heroku.com/${APP}/worker"

      - name: Release worker dyno
        env:
          HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
          APP: ${{ inputs.heroku_app_name }}
        run: |
          set -euo pipefail
          heroku container:release worker --app "$APP"
          heroku ps:scale worker=1 --app "$APP"
          echo "—— Releases ——"
          heroku releases --app "$APP" | head -5
          echo "—— Dynos ——"
          heroku ps --app "$APP"
