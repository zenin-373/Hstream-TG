# Deploy with Container Registry:
#   heroku create your-app-name
#   heroku stack:set container -a your-app-name
#   heroku container:login
#   heroku container:push worker -a your-app-name
#   heroku container:release worker -a your-app-name
#   heroku config:set BOT_TOKEN=... API_ID=... API_HASH=... -a your-app-name
# Optional: UPLOAD_CHANNEL / DUMP_CHANNEL
build:
  docker:
    worker: Dockerfile
run:
  worker:
    command:
      - python
      - -u
      - bot.py
